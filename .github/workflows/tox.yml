name: Python package

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: "3.11"
            toxenv: "py311"
          - python: "3.12"
            toxenv: "flake8,mypy,pylint,black,insenc,mapplings,py312"
          - python: "3.13"
            toxenv: "py313"

    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install tox and any other packages
        run: pip install tox
      - name: Run tox
        run: tox -e ${{ matrix.toxenv }}